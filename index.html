<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e1811">
<meta name="description" content="Roll dice in 3D and read the faces that come up.">
<title>Dice</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<canvas id="table" aria-label="Dice table"></canvas>

<div id="picker-backdrop" class="backdrop" hidden></div>
<div id="picker" class="panel" hidden role="dialog" aria-label="Choose dice">
  <p class="hint">Drag a die to add/subtract.</p>
  <div id="picker-rows" class="rows"></div>
</div>

<div id="summary-backdrop" class="backdrop" hidden></div>
<div id="summary" class="panel summary" hidden role="dialog" aria-label="Roll result">
  <h1 class="panel-title">Count</h1>
  <div id="summary-body" class="summary-body"></div>
</div>

<!-- Above the overlays, so Roll stays live while the picker is open. -->
<div class="plaques">
  <button id="reroll" class="plaque" type="button" hidden><span>Reroll</span></button>
  <button id="roll" class="plaque" type="button"><span>Roll</span></button>
  <button id="count" class="plaque" type="button" disabled><span>Count</span></button>
</div>

<!-- Motion stays off until switched on here, so nothing prompts unasked. -->
<button id="shake-toggle" class="corner-dot shake-dot" type="button" hidden
        aria-pressed="false" aria-label="Shake to roll">
  <img src="assets/shake.png" alt="">
</button>

<!-- Sits above every other overlay, and any click anywhere closes it. -->
<button id="info" class="corner-dot info-dot" type="button" aria-label="About this app">i</button>
<div id="about-backdrop" class="backdrop about-backdrop" hidden></div>
<div id="about" class="panel about" hidden role="dialog" aria-label="About">
  <div id="about-body" class="panel-text">
    <!-- Replaced by info.html at runtime; this copy shows if the fetch fails. -->
    <p><span class="who">Boris Woloszyn:</span> Artwork, game design, and concept.</p>
    <p><span class="who">M Jake Pushie:</span> Consulting, rules, app design.</p>
    <p class="copyright">&copy; 2026 Westfalia Miniatures</p>
  </div>
</div>

<div id="notice" class="panel about" hidden role="dialog" aria-label="Notice">
  <div id="notice-body" class="panel-text"></div>
</div>

<div id="fallback" class="fallback" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
